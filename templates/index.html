<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE 🌙✨ - Un espacio para cuidarte</title>
    <style>
        :root {
            --bg-main: #181416;
            --bg-card: #221c1f;
            --card-border: #382d33;
            --text-main: #f5f0f2;
            --text-muted: #b8a8b0;
            --accent: #d4af37; /* Dorado */
            --accent-glow: rgba(212, 175, 55, 0.2);
            --rose: #c98ca5; /* Palo de rosa elegante */
            --input-bg: #120f11;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- NAVEGACIÓN --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(24, 20, 22, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .user-badge {
            font-size: 0.85rem;
            background: rgba(201, 140, 165, 0.15);
            color: var(--rose);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--rose);
        }

        /* --- CONTENEDOR DE SECCIONES --- */
        .main-container {
            max-width: 1000px;
            margin: 100px auto 50px auto;
            padding: 20px;
            min-height: 80vh;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        h1 span {
            color: var(--accent);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* --- BOTONES Y TARJETAS --- */
        .btn {
            background: linear-gradient(135deg, var(--accent), #b38f26);
            color: #120f11;
            border: none;
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .btn-sm {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm:hover {
            background: var(--accent);
            color: #120f11;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: var(--rose);
        }

        /* --- SECCIÓN INICIO --- */
        .hero-section {
            text-align: center;
            padding: 40px 0;
        }

        /* --- EMOCIONES / CHECK-IN --- */
        .emotions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .emotion-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .emotion-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            background: rgba(212, 175, 55, 0.05);
        }

        /* --- FORO COMUNITARIO --- */
        .forum-post {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .forum-header-post {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .forum-author {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.95rem;
        }

        .forum-badges-inline {
            display: flex;
            gap: 6px;
        }

        .forum-badge-tag {
            font-size: 0.7rem;
            background: rgba(201, 140, 165, 0.2);
            color: var(--rose);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* --- FORMULARIOS --- */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* --- NOTIFICACIÓN FLOTANTE --- */
        #notificacion {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: none;
            z-index: 2000;
            font-size: 0.9rem;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--card-border);
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-links { display: none; }
            .main-container { margin-top: 80px; padding: 10px; }
        }
        @media(max-width: 768px) {
    nav { padding: 15px 20px; }
    
    .menu-toggle {
        display: block !important;
        background: none;
        border: none;
        color: var(--text-main);
        font-size: 1.5rem;
        cursor: pointer;
    }

    .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: var(--bg-card);
        padding: 20px 0;
        border-bottom: 1px solid var(--card-border);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .nav-links.active {
        display: flex !important;
    }

    .nav-links li {
        width: 100%;
        text-align: center;
        padding: 8px 0;
    }

    .main-container { margin-top: 80px; padding: 10px; }
}

/* Estilos para el Chat de Orientación */
.chat-container {
    max-width: 700px;
    margin: 40px auto;
    background-color: var(--bg-card, #1e1e2f);
    border: 1px solid var(--card-border, #333);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    overflow: hidden;
}

.chat-header {
    background: rgba(255, 255, 255, 0.03);
    padding: 15px 20px;
    border-bottom: 1px solid var(--card-border, #333);
    text-align: center;
}

.chat-header h3 {
    margin: 0;
    color: var(--text-main, #fff);
    font-size: 1.1rem;
}

.chat-messages {
    padding: 20px;
    max-height: 450px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.chat-message {
    background: rgba(255, 255, 255, 0.05);
    padding: 15px;
    border-radius: 10px;
    color: var(--text-main, #ddd);
    line-height: 1.5;
}

.chat-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
}

.chat-btn {
    background: transparent;
    border: 1px solid var(--rose, #e06c75);
    color: var(--text-main, #fff);
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    font-size: 0.95rem;
}

.chat-btn:hover {
    background: var(--rose, #e06c75);
    color: #fff;
}
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->

    <nav>
    <div class="nav-logo" onclick="cambiarSeccion('inicio')">ECLIPSE 🌙</div>
    
    <!-- Pon el botón aquí -->
    <button class="menu-toggle" onclick="toggleMenu()" style="display: none;">☰</button>

    <ul class="nav-links">
        <li><a id="nav-inicio" onclick="cambiarSeccion('inicio')" class="active">Inicio</a></li>
        <li><a id="nav-emociones" onclick="cambiarSeccion('emociones')">Check-in</a></li>
        <li><a id="nav-sobre" onclick="cambiarSeccion('sobre')">Sobre ECLIPSE</a></li>
        <li><a id="nav-servicios" onclick="cambiarSeccion('servicios')">Servicios</a></li>
        <li><a id="nav-foro" onclick="cambiarSeccion('foro')">Foro</a></li>
        <li><a id="nav-portafolios" onclick="cambiarSeccion('portafolios')">Portafolios</a></li>
        <li><a id="nav-diario" onclick="cambiarSeccion('diario')">Mi Diario</a></li>
        <li><a id="nav-auth" onclick="cambiarSeccion('auth')">Cuenta</a></li>
        <li><a id="nav-chat" href="javascript:void(0);" onclick="cambiarSeccion('chat')">Chat de Orientación</a></li>
    </ul>
    <div id="user-badge-container"></div>
</nav>

<!-- SECCIÓN CHAT DE ORIENTACIÓN ECLIPSE -->
<section id="chat" style="display: none;">
    <div class="chat-container">
        <div class="chat-header">
            <h3>🌙 CHAT DE ORIENTACIÓN ECLIPSE</h3>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Los mensajes aparecerán aquí de forma dinámica -->
        </div>
    </div>
</section>

    <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
    <div class="main-container" id="app"></div>

    <!-- NOTIFICACIÓN -->
    <div id="notificacion"></div>

    <!-- FOOTER -->
    <footer>
        <p>ECLIPSE 🌙✨ — Un espacio para cuidarte, conocerte y volver a encontrarte.</p>
        <p style="margin-top: 8px;">© 2026 Todos los derechos reservados.</p>
    </footer>

    <script>
        let usuarioActual = null;
        let publicacionesForo = [];

        window.onload = async function() {
            await verificarSesion();
            cambiarSeccion('inicio');
        };

        async function verificarSesion() {
            let res = await fetch('/check-session');
            let data = await res.json();
            if(data.autenticado) {
                usuarioActual = data.nombre;
                document.getElementById('user-badge-container').innerHTML = `<span class="user-badge">✨ ${usuarioActual}</span>`;
            } else {
                usuarioActual = null;
                document.getElementById('user-badge-container').innerHTML = `<button class="btn-sm" onclick="cambiarSeccion('auth')">Ingresar</button>`;
            }
        }

        function mostrarNotificacion(mensaje) {
            const notif = document.getElementById('notificacion');
            notif.innerText = mensaje;
            notif.style.display = 'block';
            setTimeout(() => { notif.style.display = 'none'; }, 3500);
        }

       async function cambiarSeccion(seccion) {
    document.querySelector('.nav-links').classList.remove('active');
    document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
    const container = document.getElementById('app');

    if (seccion === 'inicio') {
        document.getElementById('nav-inicio').classList.add('active');
        container.innerHTML = `
            <div class="hero-section">
                <h1>ECLIPSE <span>🌙 ✨</span></h1>
                <p style="font-size: 1.2rem; color: var(--rose); margin-bottom: 10px;">"Un espacio para cuidarte, conocerte y volver a encontrarte."</p>
                <p style="max-width: 600px; margin: 0 auto 30px auto;">Tu bienestar también merece un espacio. No tienes que convertirte en otra persona para sentirte bien.</p>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn" onclick="cambiarSeccion('emociones')">COMENZAR ✨</button>
                    <button class="btn-sm" onclick="cambiarSeccion('sobre')">CONOCER ECLIPSE</button>
                </div>
            </div>
        `;
    } else if (seccion === 'chat') {
        document.getElementById('nav-chat').classList.add('active');
        container.innerHTML = `
            <div class="chat-container">
                <div class="chat-header">
                    <h3>🌙 CHAT DE ORIENTACIÓN ECLIPSE</h3>
                </div>
                <div class="chat-messages" id="chat-messages"></div>
            </div>
        `;
        mostrarPasoChat('inicio');
    } else if (seccion === 'emociones') {
        document.getElementById('nav-emociones').classList.add('active');
        container.innerHTML = `
            <h1>¿Cómo te <span>sientes hoy?</span></h1>
            <p>Selecciona cómo te encuentras para recibir un mensaje especial adaptado a tu momento.</p>
            <div class="emotions-grid">
                <div class="emotion-card" onclick="responderEmocion('feliz')"><h3>😊</h3><p>Feliz</p></div>
                <div class="emotion-card" onclick="responderEmocion('tranquilo')"><h3>😌</h3><p>Tranquilo</p></div>
                <div class="emotion-card" onclick="responderEmocion('motivado')"><h3>🥰</h3><p>Motivado/a</p></div>
                <div class="emotion-card" onclick="responderEmocion('normal')"><h3>😐</h3><p>Normal</p></div>
                <div class="emotion-card" onclick="responderEmocion('triste')"><h3>😔</h3><p>Triste</p></div>
                <div class="emotion-card" onclick="responderEmocion('estresado')"><h3>😩</h3><p>Estresado/a</p></div>
                <div class="emotion-card" onclick="responderEmocion('cansado')"><h3>🥱</h3><p>Cansado/a</p></div>
                <div class="emotion-card" onclick="responderEmocion('nose')"><h3>🖤</h3><p>No sé</p></div>
            </div>
            <div id="resultado-emocion" style="margin-top: 25px;"></div>
        `;
            } else if (seccion === 'sobre') {
                document.getElementById('nav-sobre').classList.add('active');
                container.innerHTML = `
                    <h1>Sobre <span>ECLIPSE</span></h1>
                    <div class="card">
                        <p style="font-size: 1.05rem; color: var(--text-main);">“ECLIPSE es un espacio creado para acompañarte en el proceso de conocerte, cuidarte y fortalecer tu bienestar. Ofrecemos orientación personalizada y espacios individuales adaptados a cada caso, buscando que cada persona encuentre herramientas que puedan servirle en su propio proceso.”</p>
                        <button class="btn-sm" style="margin-top: 15px;" onclick="cambiarSeccion('servicios')">CONOCER NUESTRO PROPÓSITO</button>
                    </div>
                `;
            } else if (seccion === 'servicios') {
                document.getElementById('nav-servicios').classList.add('active');
                container.innerHTML = `
                    <h1>Nuestros <span>Servicios</span></h1>
                    <p>Estamos aquí para escucharte y acompañarte.</p>
                    <div class="card">
                        <h3>🌷 Orientación Personalizada</h3>
                        <p>Recibe orientación adaptada a tus necesidades, intereses y situación particular.</p>
                        <button class="btn-sm" onclick="verDetalleServicio('orientacion')">CONOCER MÁS →</button>
                    </div>
                    <div class="card">
                        <h3>💬 Asesorías Individuales</h3>
                        <p>Espacios individuales en los que puedes conversar sobre tu situación y recibir orientación específica.</p>
                        <button class="btn-sm" onclick="verDetalleServicio('asesoria')">ASESORÍA INDIVIDUAL →</button>
                    </div>
                    <div id="detalle-servicio-container" style="margin-top: 30px;"></div>
                `;
            } else if (seccion === 'foro') {
                document.getElementById('nav-foro').classList.add('active');
                let res = await fetch('/api/foro');
                publicacionesForo = await res.json();

                let htmlPosts = publicacionesForo.map(p => {
                    let insigniasHTML = '';
                    if (p.insignias) {
                        let ins = typeof p.insignias === 'string' ? JSON.parse(p.insignias.replace(/'/g, '"')) : p.insignias;
                        if (ins.diario) insigniasHTML += `<span class="forum-badge-tag">📖 Diario</span>`;
                        if (ins.respiracion) insigniasHTML += `<span class="forum-badge-tag">🧘 Calma</span>`;
                        if (ins.foro) insigniasHTML += `<span class="forum-badge-tag">💬 Foro</span>`;
                        if (ins.reto) insigniasHTML += `<span class="forum-badge-tag">⭐ Reto</span>`;
                    }

                    let comentariosHTML = '';
                    if (p.comentarios && p.comentarios.length > 0) {
                        comentariosHTML = `<div style="margin-top: 12px; border-top: 1px solid var(--card-border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">`;
                        p.comentarios.forEach(c => {
                            comentariosHTML += `
                                <div style="background: rgba(0,0,0,0.15); padding: 8px 12px; border-radius: 10px; font-size: 0.82rem;">
                                    <span style="color: var(--accent); font-weight: 600;">${c.autor}:</span> ${c.texto}
                                </div>
                            `;
                        });
                        comentariosHTML += `</div>`;
                    }

                    return `
                        <div class="forum-post">
                            <div class="forum-header-post">
                                <span class="forum-author">${p.autor}</span>
                                <div class="forum-badges-inline">${insigniasHTML}</div>
                            </div>
                            <div class="forum-content" style="margin-bottom: 10px;">${p.texto}</div>
                            ${comentariosHTML}
                            <div style="margin-top: 12px; display: flex; gap: 8px;">
                                <input type="text" id="comentario-input-${p.id}" placeholder="Escribe una palabra de aliento..." style="flex:1; padding: 7px 12px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 0.82rem; outline: none;">
                                <button class="btn-sm" onclick="enviarComentario(${p.id})">Responder</button>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <h1>Foro <span>Comunitario</span></h1>
                    <p>Comparte mensajes de aliento y responde a las publicaciones de otros miembros.</p>
                    <div class="forum-list">
                        ${htmlPosts.length > 0 ? htmlPosts : '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding: 20px;">El foro está vacío. ¡Sé el primero en compartir un mensaje positivo!</p>'}
                    </div>
                    <div class="input-group" style="margin-top: 15px;">
                        <textarea id="texto-foro" placeholder="Escribe un mensaje principal para la comunidad..."></textarea>
                    </div>
                    <button class="btn" onclick="publicarForo()">Publicar en el Foro</button>
                `;
            } else if (seccion === 'portafolios') {
                document.getElementById('nav-portafolios').classList.add('active');
                container.innerHTML = `
                    <h1>Nuestro <span>Portafolio ✨</span></h1>
                    <p>Explora nuestras categorías enfocadas en tu bienestar y crecimiento personal.</p>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px;">
                        <div class="card">
                            <h3>🌸 Portafolio de Autocuidado</h3>
                            <p>Rutinas, recomendaciones y actividades diarias.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('autocuidado')">VER PORTAFOLIO</button>
                        </div>
                        <div class="card">
                            <h3>💗 Portafolio de Autoestima</h3>
                            <p>Recursos para fortalecer la confianza y reconocer tus cualidades.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('autoestima')">VER PORTAFOLIO</button>
                        </div>
                        <div class="card">
                            <h3>🌿 Portafolio de Bienestar</h3>
                            <p>Contenido relacionado con hábitos saludables y bienestar.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('bienestar')">VER PORTAFOLIO</button>
                        </div>
                        <div class="card">
                            <h3>💭 Portafolio Emocional</h3>
                            <p>Herramientas para identificar y expresar emociones.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('emocional')">VER PORTAFOLIO</button>
                        </div>
                        <div class="card">
                            <h3>✨ Portafolio de Rutinas</h3>
                            <p>Ideas de pequeñas rutinas de cuidado personal.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('rutinas')">VER PORTAFOLIO</button>
                        </div>
                        <div class="card">
                            <h3>🪞 Portafolio de Amor Propio</h3>
                            <p>Actividades y reflexiones para conocerse mejor.</p>
                            <button class="btn-sm" onclick="verDetallePortafolio('amorpropio')">VER PORTAFOLIO</button>
                        </div>
                    </div>
                    <div id="detalle-portafolio-container" style="margin-top: 30px;"></div>
                `;
            } else if (seccion === 'diario') {
                document.getElementById('nav-diario').classList.add('active');
                if(!usuarioActual) {
                    container.innerHTML = `<h1>Mi <span>Diario</span></h1><p>Por favor ingresa con tu cuenta para acceder a tu espacio personal de escritura.</p><button class="btn" onclick="cambiarSeccion('auth')">Ir a Cuenta</button>`;
                    return;
                }
                let res = await fetch('/api/diario');
                let entradas = await res.json();
                let htmlEntradas = entradas.map(e => `<div class="card"><small style="color:var(--accent);">${e.fecha}</small><p style="margin-top:8px;">${e.texto}</p></div>`).join('');

                container.innerHTML = `
                    <h1>Mi <span>Diario</span></h1>
                    <p>Un espacio seguro solo para ti.</p>
                    <div class="input-group">

        async function ejecutarLogin() {
            let user = document.getElementById('auth-user').value;
            let pass = document.getElementById('auth-pass').value;
            let res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `usuario=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
            });
            if(res.ok) {
                mostrarNotificacion("¡Bienvenido de nuevo!");
                await verificarSesion();
                cambiarSeccion('inicio');
            } else {
                mostrarNotificacion("Credenciales incorrectas.");
            }
        }

        async function ejecutarRegistro() {
            let user = document.getElementById('auth-user').value;
            let pass = document.getElementById('auth-pass').value;
            let res = await fetch('/registro', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `usuario=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
            });
            if(res.ok) {
                mostrarNotificacion("¡Cuenta creada con éxito!");
                await verificarSesion();
                cambiarSeccion('inicio');
            } else {
                mostrarNotificacion("El usuario ya existe o faltan datos.");
            }
        }

        async function guardarEntradaDiario() {
            let texto = document.getElementById('texto-diario').value;
            let fechaHoy = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            let res = await fetch('/api/diario', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ texto: texto, fecha: fechaHoy })
            });
            if(res.ok) {
                mostrarNotificacion("¡Entrada guardada con éxito!");
                cambiarSeccion('diario');
            } else {
                mostrarNotificacion("Escribe algo antes de guardar.");
            }
        }

            if(!usuarioActual) {

                return;

            let texto = document.getElementById('texto-foro').value;

                mostrarNotificacion("¡Publicado en el foro con éxito!");

        async function enviarComentario(pubId) {
            if(!usuarioActual) {
                mostrarNotificacion("Debes iniciar sesión para comentar.");
                cambiarSeccion('auth');
                return;
            }
            const input = document.getElementById(`comentario-input-${pubId}`);
            const texto = input.value;
            if(!texto.trim()) { mostrarNotificacion("Escribe un comentario antes de enviar."); return; }

            const fechaHoy = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });

            let res = await fetch('/api/foro/comentar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ publicacion_id: pubId, texto: texto, fecha: fechaHoy })
            });

            if(res.ok) {
                mostrarNotificacion("¡Respuesta enviada con éxito!");
                cambiarSeccion('foro'); 
            } else {
                mostrarNotificacion("Error al enviar el comentario.");
            }
        }

    <script>
    // Lógica del Chat de Orientación ECLIPSE
   const chatSteps = {
    inicio: {
        text: "¡Hola! Soy tu guía en ECLIPSE 🌙. Estoy aquí para acompañarte y orientarte en lo que necesites. ¿Cómo te sientes el día de hoy?",
        options: [
            { text: "Me siento abrumado/a o estresado/a", next: "estres" },
            { text: "Necesito hablar sobre mis emociones o reflexionar", next: "emociones" },
            { text: "Quiero explorar herramientas de bienestar", next: "herramientas" }
        ]
    },
    estres: {
        text: "Lamento que te sientas así, pero recuerda que es totalmente válido. Respira hondo... 🌬️ ¿Te gustaría hacer un ejercicio rápido de respiración o prefieres leer algunas recomendaciones para calmar la mente?",
        options: [
            { text: "Hacer ejercicio de respiración guiada", next: "respiracion" },
            { text: "Ver recomendaciones de calma", next: "consejos_estres" },
            { text: "Volver al inicio", next: "inicio" }
        ]
    },
    emociones: {
        text: "Reconocer lo que sentimos es el primer paso para sanar. Puedes usar la sección de 'Check-in' en el menú superior para registrar tu emoción exacta de hoy, o escribir en tu espacio de 'Mi Diario'. ¿Qué prefieres hacer?",
        options: [
            { text: "Ir al Check-in de emociones", action: () => cambiarSeccion('emociones') },
            { text: "Ir a Mi Diario personal", action: () => cambiarSeccion('diario') },
            { text: "Volver al inicio", next: "inicio" }
        ]
    },
    herramientas: {
        text: "Tenemos varios espacios diseñados para ti: el foro comunitario donde puedes expresarte de forma segura, y las reflexiones diarias. ¿Qué te gustaría explorar?",
        options: [
            { text: "Visitar el Foro Comunitario", action: () => cambiarSeccion('foro') },
            { text: "Volver al inicio", next: "inicio" }
        ]
    },
    respiracion: {
        text: "Inhala profundamente durante 4 segundos... Mantén el aire por 4 segundos... y exhala despacio durante 4 segundos. 🌿 Repite esto 3 veces. ¿Te sientes un poco mejor?",
        options: [
            { text: "Sí, gracias, me siento más tranquilo/a", next: "inicio" },
            { text: "Quiero volver a empezar", next: "inicio" }
        ]
    },
    consejos_estres: {
        text: "Aquí tienes 3 tips rápidos:\n1. Aléjate un momento de las pantallas.\n2. Toma un vaso con agua fría.\n3. Escribe en un papel lo que te preocupa para sacarlo de tu cabeza.\n\n¿Te sirve esta guía?",
        options: [
            { text: "¡Muchísimas gracias!", next: "inicio" },
            { text: "Volver al inicio", next: "inicio" }
        ]
    }
};
    function mostrarPasoChat(pasoKey) {
        const contenedorMensajes = document.getElementById('chat-messages');
        if (!contenedorMensajes) return;

        const paso = chatSteps[pasoKey];
        if (!paso) return;

        // Crear burbuja de mensaje del bot
        const divMensaje = document.createElement('div');
        divMensaje.className = 'chat-message';
        
        // Formatear saltos de línea si los hay
        divMensaje.innerHTML = `<p style="margin: 0; color: var(--text-main);">${paso.text.replace(/\n/g, '<br>')}</p>`;

        // Crear contenedor de opciones
        if (paso.options && paso.options.length > 0) {
            const divOpciones = document.createElement('div');
            divOpciones.className = 'chat-options';

            paso.options.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'chat-btn';
                btn.textContent = opcion.text;
                
                btn.onclick = () => {
                    // Desactivar opciones anteriores para limpiar la interfaz
                    divOpciones.querySelectorAll('button').forEach(b => b.disabled = true);
                    
                    // Mostrar la selección del usuario como un mensaje rápido o continuar
                    if (opcion.next) {
                        mostrarPasoChat(opcion.next);
                    } else if (opcion.action) {
                        opcion.action();
                    }
                };

                divOpciones.appendChild(btn);
            });

            divMensaje.appendChild(divOpciones);
        }

        contenedorMensajes.appendChild(divMensaje);
        
        // Auto-scroll hacia abajo para ver el nuevo mensaje
        contenedorMensajes.scrollTop = contenedorMensajes.scrollHeight;
    }

    // Inicializar el chat cuando se cargue la sección o la página
    document.addEventListener("DOMContentLoaded", () => {
        // Si ya tienes una función 'cambiarSeccion', nos aseguramos de que inicialice el chat al entrar
        const originalCambiarSeccion = window.cambiarSeccion;
        if (typeof originalCambiarSeccion === 'function') {
            window.cambiarSeccion = function(seccion) {
                originalCambiarSeccion(seccion);
                if (seccion === 'chat') {
                    const mensajes = document.getElementById('chat-messages');
                    if (mensajes && mensajes.children.length === 0) {
                        mostrarPasoChat('inicio');
                    }
                }
            };
        }
    });
</script>
